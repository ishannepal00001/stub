[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stub"
version = "0.1.0"
description = "A tiny CLI for creating dated learning notes and code stubs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.4",
]

[project.scripts]
stub = "stub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
